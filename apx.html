<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APX — Pipeline Exchange</title>
<style>
:root{--bg:#f2f4f7;--surface:#fff;--surface2:#f5f7fa;--line:#e1e5ea;--text:#12161c;--mute:#707a8a;--accent:#1e5fe0;--accent-ink:#fff;--accent-soft:#e6eefc;--up:#0a8f5c;--up-bg:#e3f5ec;--warn:#9a6a00;--warn-bg:#fbf1d8;--ok:#0a8f5c;--ok-bg:#e3f5ec;--err:#d0342c;--lock:#f5f7fa;--r:4px}
[data-theme=dark]{--bg:#0b0e11;--surface:#161a1e;--surface2:#1e2329;--line:#2b3139;--text:#eaecef;--mute:#848e9c;--accent:#4c8dff;--accent-ink:#0b0e11;--accent-soft:#16233d;--up:#2ebd85;--up-bg:#12332a;--warn:#f0b90b;--warn-bg:#33290a;--ok:#2ebd85;--ok-bg:#12332a;--err:#f6465d;--lock:#12161a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",Roboto,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent);text-decoration:none}
.mono,.num,b.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:600}
h1{font-size:34px;letter-spacing:-.02em}h2{font-size:20px}h3{font-size:14px}h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:20px;height:48px}
.logo{font-weight:800;letter-spacing:.12em;color:var(--text);font-size:16px;display:flex;align-items:center;gap:8px}
.logo i{display:inline-block;width:16px;height:16px;background:var(--accent);clip-path:polygon(0 100%,0 55%,30% 55%,30% 30%,60% 30%,60% 0,100% 0,100% 100%)}
nav.links{display:flex;gap:0;flex:1;overflow-x:auto;scrollbar-width:none;height:100%}
nav.links a{color:var(--mute);padding:0 14px;display:flex;align-items:center;white-space:nowrap;font-weight:500;border-bottom:2px solid transparent}
nav.links a.on,nav.links a:hover{color:var(--text)}
nav.links a.on{border-color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface2);border-radius:var(--r);padding:2px}
.seg button{border:0;background:transparent;color:var(--mute);padding:3px 9px;cursor:pointer;font:inherit;font-size:12px;border-radius:3px}
.seg button.on{background:var(--line);color:var(--text)}
select,input[type=text],input[type=email],input[type=url],textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:1px solid var(--accent);border-color:var(--accent)}
.tools select{width:auto;padding:4px 8px;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 18px;border-radius:var(--r);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--mute)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}
.btn.danger{background:transparent;border-color:var(--err);color:var(--err)}
#ticker{border-top:1px solid var(--line);background:var(--bg);overflow:hidden;height:28px;display:flex;align-items:center;font-size:12px}
#ticker .tk{display:flex;gap:32px;white-space:nowrap;animation:tk 60s linear infinite;padding-left:32px}
#ticker:hover .tk{animation-play-state:paused}
#ticker span{color:var(--mute)}#ticker b{font-family:ui-monospace,Menlo,monospace;font-weight:500;color:var(--text);margin-left:6px}#ticker b.up{color:var(--up)}
@keyframes tk{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#ticker .tk{animation:none}}
main{min-height:70vh;padding:20px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:3px;background:var(--surface2);color:var(--mute);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.mute{color:var(--mute)}.sm{font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
section.blk{margin-top:40px}
section.blk>h2{margin-bottom:4px}section.blk>.sub{color:var(--mute);margin-bottom:14px;max-width:720px}
.hero{padding:20px 0 0}
.hgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:stretch}
.hero p.lead{font-size:15px;color:var(--mute);max-width:640px;margin:14px 0 22px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn{padding:11px 24px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel .ph{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.panel .pr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel .pr:last-of-type{border:0}
.panel .pr span{color:var(--mute);font-size:12px;max-width:190px}
.panel .pr b{font-size:24px;font-weight:600;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.panel .pr b.up{color:var(--up)}
.panel .pf{padding:8px 14px;color:var(--mute);font-size:11px;border-top:1px solid var(--line)}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--surface2);border-radius:var(--r)}
.steps li span.n{flex:none;width:20px;height:20px;border-radius:3px;background:var(--line);color:var(--text);font-size:11px;display:grid;place-items:center;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.merge{text-align:center;margin:10px 0;padding:8px;border:1px solid var(--accent);border-radius:var(--r);color:var(--accent);font-weight:600;background:var(--accent-soft);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chain div{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);position:relative}
.chain div:not(:last-child):after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--mute);z-index:2;font-size:16px}
footer{border-top:1px solid var(--line);background:var(--surface);padding:22px 0;color:var(--mute);font-size:12px}
footer .cols{display:flex;gap:30px;flex-wrap:wrap;justify-content:space-between}
.cat{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.filters{position:sticky;top:90px;padding:4px 14px 14px}
.filters h4{margin:14px 0 6px}
.filters label,.chk{display:flex;gap:8px;align-items:center;padding:2px 0;cursor:pointer}
.chk input,.filters input{width:auto;accent-color:var(--accent)}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar input{flex:1}.toolbar select{width:auto}
.mkt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mrow{display:grid;grid-template-columns:70px minmax(0,2.6fr) 84px 76px minmax(0,1.3fr) minmax(0,1.2fr) 110px 88px;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border:0}
.mrow:not(.mh):hover{background:var(--surface2)}
.mrow.mh{cursor:default;background:var(--surface2);color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:8px 14px}
.mrow .ttl{font-weight:600;color:var(--text)}
.mrow .sub2{color:var(--mute);font-size:12px;margin-top:1px}
.mrow .sc{display:flex;align-items:center;gap:8px}
.mrow .sc b{color:var(--up);font-size:15px;min-width:24px}
.bar-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:1}
.bar-fill{height:100%;background:var(--up)}
.co{color:var(--mute);font-size:11px}
.pill{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:3px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:130px 1fr;gap:0;margin:0}
.kv dt,.kv dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0}
.kv dt{color:var(--mute)}
.layer{margin-top:12px}
.layer .lh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lock{background:var(--lock);border-style:dashed;text-align:center;padding:22px}
.lock .ico{font-size:20px;opacity:.7}
.lock ul{list-style:none;padding:0;margin:10px auto;display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center}
.brk{display:grid;gap:10px}
.brk .row{display:grid;grid-template-columns:90px 1fr 30px;gap:10px;align-items:center}
.crumb{color:var(--mute);margin-bottom:10px;font-size:12px}
.formw{max-width:720px;margin:0 auto}
.prog{display:flex;gap:6px;margin:16px 0}
.prog div{flex:1;font-size:12px;color:var(--mute);border-top:2px solid var(--line);padding-top:6px}
.prog div.on{border-color:var(--accent);color:var(--text)}
.prog div.done{border-color:var(--up);color:var(--up)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:4px}.fld.full{grid-column:1/-1}
.fld>label,.fld>.lbl{font-weight:500;font-size:12px;color:var(--mute)}
.fld .req{color:var(--err)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--err)}
.emsg{color:var(--err);font-size:12px}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px}
.upload{border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--mute);cursor:pointer;background:var(--surface2)}
.upload.has{color:var(--ok);border-color:var(--ok)}
.actions{display:flex;justify-content:space-between;margin-top:20px}
.success{text-align:center;padding:40px 20px}
.success .ok-i{width:44px;height:44px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;font-size:22px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dsec{margin-top:24px}.dsec>h3{margin-bottom:8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.list{display:grid;gap:8px}
.row2{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:12px 0}
.pipe div{font-size:11px;color:var(--mute);border-top:3px solid var(--line);padding-top:4px}
.pipe div.on{border-color:var(--up);color:var(--text)}
.pipe div.cur{font-weight:700;color:var(--up)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border:0}
th{color:var(--mute);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:20px}
.modal .card{max-width:420px;width:100%}
.modal .actions{justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:60}
.info{padding:8px 10px;border-radius:var(--r);background:var(--surface2);border-left:2px solid var(--accent);font-size:12px}
.score{text-align:right}
.score b{display:block;font-size:26px;font-family:ui-monospace,Menlo,monospace;color:var(--up)}
.score span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
@media(max-width:860px){
 h1{font-size:26px}
 .hgrid,.flow,.g2,.two,.cat,.fg{grid-template-columns:1fr}
 .g3,.g4,.chain{grid-template-columns:1fr 1fr}
 .filters{position:static}.chain div:after{display:none}
 .bar{gap:10px;flex-wrap:wrap;height:auto;padding-top:8px}nav.links{order:3;flex-basis:100%;height:36px}
 .mrow.mh{display:none}
 .mrow{grid-template-columns:1fr 1fr;gap:8px 12px}
 .mrow>div:nth-child(2){grid-column:1/-1;order:-1}
 .mrow>div[data-l]:before{content:attr(data-l);display:block;color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
 .kv{grid-template-columns:100px 1fr}
}
@media(max-width:520px){.g3,.g4,.chain{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.pipe div{font-size:10px}.logo span{display:none}.tools{margin-left:auto}}

.ic{flex:none;vertical-align:middle}
:root{--tc-amylin:#2a78d6;--tc-multi:#1baf7a;--tc-glp1:#eb6834;--tc-mstn:#4a3aa7}
[data-theme=dark]{--tc-amylin:#3987e5;--tc-multi:#199e70;--tc-glp1:#d95926;--tc-mstn:#9085e9}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.tile{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .tl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.tile .tv{font-size:30px;font-weight:600;font-family:ui-monospace,Menlo,monospace;letter-spacing:-.02em}
.tile .td{font-size:12px;color:var(--up);font-family:ui-monospace,Menlo,monospace}
.tile .row2{align-items:flex-end;flex-wrap:nowrap}
.spark .sl{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.spark .sa{fill:var(--accent);opacity:.12}.spark .sd{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ring .rt{fill:none;stroke:var(--line)}.ring .rf{fill:none;stroke:var(--up)}.ring .rv{fill:var(--text);font-family:ui-monospace,Menlo,monospace;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mute);font-size:12px;background:var(--surface)}
.chip .ic{color:var(--accent)}
.lane{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.lname{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.node{position:relative;padding-right:14px;min-width:0}
.node:not(:last-child):after{content:"";position:absolute;top:19px;left:46px;right:6px;height:1px;background:var(--line)}
.nic{width:38px;height:38px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;position:relative;z-index:1}
.node .nn{font-size:10px;color:var(--mute);margin-top:8px}
.node .nt{font-size:12px;line-height:1.35;margin-top:2px}
.conv{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 8px}
.conv:before,.conv:after{content:"";flex:1;height:1px;background:var(--accent);opacity:.5}
.conv b{display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border:1px solid var(--accent);border-radius:99px;color:var(--accent);background:var(--accent-soft);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.lane.chainl{grid-template-columns:1fr}
.feat{display:flex;flex-direction:column;gap:10px}
.feat .fi{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.layp{position:relative;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.layp .lv{height:3px;background:var(--line);border-radius:2px;margin-top:auto}.layp .lv i{display:block;height:100%;background:var(--accent);border-radius:2px}
.layp.o1 .lv i{width:33%}.layp.o2 .lv i{width:66%}.layp.o3 .lv i{width:100%}
.layp .lb{display:flex;justify-content:space-between;align-items:center;color:var(--accent)}
.layp .lb span{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute)}
.snap{display:grid;grid-template-columns:150px 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.snap>div{background:var(--surface);padding:12px 14px;min-width:0}
.snap .big{font-size:36px;font-weight:600;font-family:ui-monospace,Menlo,monospace;line-height:1}
.stk{display:flex;gap:2px;height:10px;margin:10px 0 8px}.stk i{display:block;border-radius:2px;min-width:4px}
.leg{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.leg b{color:var(--text);font-family:ui-monospace,Menlo,monospace;font-weight:500;margin-left:2px}
.hb{display:grid;grid-template-columns:76px 1fr 22px;gap:8px;align-items:center;font-size:12px;margin-top:6px}
.hb div.t{height:6px;background:var(--surface2);border-radius:2px}.hb div.t i{display:block;height:100%;background:var(--accent);border-radius:2px}
.dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}.dots i{width:14px;height:4px;background:var(--line);border-radius:2px}.dots i.on{background:var(--accent)}
.mrow .chipt{display:inline-flex;align-items:center;font-size:12px;color:var(--mute);margin-top:2px}
.tl{display:grid;grid-template-columns:repeat(5,1fr);margin:16px 0 6px}
.tl div{position:relative;font-size:11px;color:var(--mute);padding-top:16px;text-align:left}
.tl div:before{content:"";position:absolute;top:4px;left:0;right:0;height:2px;background:var(--line)}
.tl div:after{content:"";position:absolute;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl div.on:before{background:var(--accent)}.tl div.on:after{background:var(--accent);border-color:var(--accent)}
.tl div.cur{color:var(--text);font-weight:600}.tl div.cur:after{box-shadow:0 0 0 4px var(--accent-soft)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0}
.facts div{background:var(--surface);padding:10px 12px}.facts span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}.facts b{font-weight:600}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ins .card{display:flex;gap:12px;padding:14px}.ins .card .fi{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ins h4{margin-bottom:4px}
.skel{display:grid;gap:8px;max-width:340px;margin:0 auto 14px;opacity:.6}.skel i{display:block;height:8px;border-radius:2px;background:var(--line)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpis>div{background:var(--surface);padding:14px 16px;display:flex;gap:12px;align-items:center}
.kpis .ki{width:36px;height:36px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.kpis b{display:block;font-size:24px;font-family:ui-monospace,Menlo,monospace;line-height:1.1}.kpis span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.pipe{gap:0}
.pipe div{border-top:2px solid var(--line);position:relative;padding-top:14px}

 const nxt=r=>r.status==='pending'?`<span class="mute">${t('nxp')}</span>`:r.type==='cda'?`<a href="#asset?id=${r.id}">${t('nxs')}</a>`:`<a href="#asset?id=${r.id}">${t('nxo')}</a>`;
 const rq=S.reqs.map(r=>{const a=getA(r.id);return `<tr><td><a href="#asset?id=${r.id}"><span class="mono">${r.id}</span></a> · ${L(a.mech).slice(0,42)}…</td><td>${t('rq_'+r.type)}</td><td>${statusTag(r.status)}</td><td>${nxt(r)}</td><td class="mono">${r.d}</td></tr>`}).join('');
 const wl=Object.keys(S.watch).filter(k=>S.watch[k]).map(id=>{const a=getA(id);return `<div class="card row2" style="padding:10px 14px"><div><span class="tag mono">${id}</span> <b>${L(a.mech)}</b><div class="co">${tdot(a.tg)}${t('tg_'+a.tg)} · ${t('st_'+a.stage)}</div></div><div style="display:flex;gap:10px;align-items:center">${ring(a.score,36,4)}${star(id)}<a class="btn sm ghost" href="#asset?id=${id}">${t('view')}</a></div></div>`}).join('')||`<div class="card mute">${t('wl_empty')}</div>`;
 const pend=S.reqs.filter(r=>r.status==='pending').length,opened=S.reqs.filter(r=>r.status==='opened').length;
 return `<div class="dh"><h2>${t('bd_h')}</h2><span class="tag ok">✓ ${t('verified')}</span></div>
 <div class="nba"><div>${ic('bell',20)}<span>${t('nb_b').replace('{n}',MATCH.filter(m=>m.fit>=85).length)}</span></div><button class="btn sm" data-scroll="#bd-matches">${t('nb_b_go')}</button></div>
 <div class="kpis">${kpi('target',S.mands.length,t('k_m'))}${kpi('bell',MATCH.length,t('k_new'))}${kpi('mail',pend,t('k_open'))}${kpi('db',opened,t('k_dr'))}</div>
 <div class="dsec"><h3>${t('bd_m')}${qm('mandate')}</h3><div class="grid g2">${ms}</div></div>
 <div class="dsec" id="bd-matches"><h3>${t('bd_p')}</h3><p class="mute sm" style="margin:-6px 0 10px">${t('bd_ps')}</p><div class="list">${mt}</div></div>
 <div class="dsec"><h3>${t('wl')}</h3>${wl}</div>
 <div class="dsec"><h3>${t('bd_r')}</h3><div class="card" style="overflow-x:auto"><table><tr><th>${t('asset')}</th><th>${t('type')}</th><th>${t('status')}</th><th>${t('nx_col')}</th><th>${t('date')}</th></tr>${rq}</table></div></div>`;
}
function sellerDash(){
 if(S.role!=='seller')return gate();
 const stg=['p1','p2','p3','p4','p5'];
 const rows=SELL.map(s=>{
  const open=S.fbOpen[s.id];
  const fb=s.bk?`<div class="brk" style="max-width:420px">${[['sc_sci',s.bk[0]],['sc_dat',s.bk[1]],['sc_cmp',s.bk[2]],['sc_dea',s.bk[3]]].map(([k,v])=>`<div class="row"><span>${t(k)}</span><div class="bar-track"><div class="bar-fill" style="width:${v}%"></div></div><b class="mono">${v}</b></div>`).join('')}</div><h4 style="margin:12px 0 4px">${t('sugg')}</h4><ul style="margin:0;padding-left:18px">${s.sg.map(x=>`<li>${L(x)}</li>`).join('')}</ul>`:`<p class="mute">${t('fb_wait')}</p>`;
  return `<div class="card"><div class="row2"><div><span class="tag mono">${s.id}</span> <b>${L(s.name)}</b></div>${s.score?`<span class="tag acc">${t('score')} <b class="mono">${s.score}</b></span>`:''}</div>
  <div class="pipe">${stg.map((k,i)=>`<div class="${i<s.stage?'on':''}${i===s.stage-1?' cur':''}">${t(k)}</div>`).join('')}</div>
  <div class="nxl">${ic('bell',14)}${t('sn'+s.stage)}</div><div style="margin-top:10px"></div><button class="btn ghost sm" data-fb="${s.id}">${open?t('fb_close'):t('fb_open')}</button>${open?`<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)"><h4 style="margin-bottom:8px">${t('fb')}</h4>${fb}</div>`:''}</div>`}).join('');
 const ints=SELL.filter(s=>s.int.length).map(s=>`<div class="card"><b>${L(s.name)}</b><table style="margin-top:8px"><tr><th>${t('buyer')}</th><th>${t('status')}</th></tr>${s.int.map(i=>`<tr><td>${i.cda?`<b>${i.n}</b> <span class="mute sm">· ${L(i.t)} · ${L(i.r)}</span>`:`${L(i.t)} · ${L(i.r)}`}</td><td>${i.cda?`<span class="tag ok">${t('post_cda')}</span>`:`<span class="tag">${t('pre_cda')}</span>`}</td></tr>`).join('')}</table></div>`).join('');
 const dr=SELL.flatMap(s=>s.dr.map(d=>({...d,a:s}))).map(d=>{const k=d.a.id+d.n;const rv=S.revoked[k];return `<tr><td><b>${d.n}</b><br><span class="mute sm">${d.p}</span></td><td>${L(d.a.name)}</td><td class="mono">${d.d}</td><td>${rv?`<span class="tag">${t('revoked')}</span>`:`<button class="btn danger sm" data-revoke="${k}">${t('revoke')}</button>`}</td></tr>`}).join('');
 const intAll=SELL.flatMap(x=>x.int),types={};intAll.forEach(i=>{const k=L(i.t);types[k]=(types[k]||0)+1});const tmx=Math.max(1,...Object.values(types));
 const grants=SELL.flatMap(x=>x.dr.map(d=>x.id+d.n)).filter(k=>!S.revoked[k]).length;
 return `<div class="dh"><h2>${t('sd_h')}</h2></div>
 <div class="nba"><div>${ic('users',20)}<span>${t('nb_s').replace('{n}',intAll.length)}</span></div><button class="btn sm" data-scroll="#sd-int">${t('nb_s_go')}</button></div>
 <div class="kpis">${kpi('file',SELL.length,t('k_a'))}${kpi('list',SELL.filter(x=>x.stage>=4).length,t('k_l'))}${kpi('users',intAll.length,t('k_i'))}${kpi('key',grants,t('k_g'))}</div>
 <div class="dsec"><h3>${t('sd_a')}</h3><div class="list">${rows}</div></div>
 <div class="dsec" id="sd-int"><h3>${t('sd_i')}</h3><p class="mute sm" style="margin:-6px 0 10px">${t('sd_is')}</p><div class="card" style="margin-bottom:10px"><h4 style="margin-bottom:10px">${t('int_type')}</h4>${donut(Object.entries(types))}</div><div class="grid g2">${ints||`<div class="card mute">${t('no_int')}</div>`}</div></div>
 <div class="dsec"><h3>${t('sd_d')}</h3><div class="card" style="overflow-x:auto">${dr?`<table><tr><th>${t('buyer')}</th><th>${t('asset')}</th><th>${t('granted')}</th><th></th></tr>${dr}</table>`:`<span class="mute">${t('none_dr')}</span>`}</div></div>`;
}
/* ---------- render ---------- */
function render(){
 chrome();const {r,p}=route();
 const pages={home:home,assets:assets,asset:()=>asset(p),buyer:()=>wizard('buyer'),seller:()=>wizard('seller'),'buyer-dash':buyerDash,'seller-dash':sellerDash};
 $('#app').innerHTML=(pages[r]||home)();
}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}
function modal(){ $('#overlay').innerHTML=`<div class="modal" data-close><div class="card" role="dialog"><h3>${t('m_login_t')}</h3><p class="mute" style="margin:8px 0 16px">${t('m_login_d')}</p><div class="actions"><button class="btn ghost" data-close>${t('m_cancel')}</button><a class="btn" href="#buyer" data-close>${t('m_reg')}</a></div></div></div>`}
/* ---------- events ---------- */
addEventListener('hashchange',()=>{$('#overlay').innerHTML='';render();scrollTo(0,0)});
document.addEventListener('click',e=>{
 const g=s=>e.target.closest(s);let x;
 if(x=g('[data-watch]')){e.stopPropagation();if(S.role==='guest'){S.ret=location.hash;modal();return}if(S.role==='seller'){toast(t('s_role_note'));return}const id=x.dataset.watch;S.watch[id]=!S.watch[id];render();return}
 if(x=g('[data-rmf]')){const [k,v]=x.dataset.rmf.split('|');if(k==='q')S.q='';else S.flt[k]=S.flt[k].filter(y=>y!==v);render();return}
 if(x=g('[data-goto]')){const [f,i]=x.dataset.goto.split(':');S.step[f]=+i;render();return}
 if(x=g('[data-scroll]')){const el=$(x.dataset.scroll);el&&el.scrollIntoView({behavior:'smooth',block:'start'});return}
 if(x=g('[data-demox]')){S.demoOff=true;render();return}
 if(x=g('[data-href]')){location.hash=x.dataset.href;return}
 if(x=g('[data-lang]')){S.lang=x.dataset.lang;render();return}
 if(x=g('[data-theme-t]')){S.theme=x.dataset.themeT;render();return}
 if(x=g('[data-close]')){if(e.target===x||x.tagName==='BUTTON'||x.tagName==='A')$('#overlay').innerHTML='';return}
 if(x=g('[data-setr]')){S.role=x.dataset.setr;render();return}
 if(x=g('[data-setrole]')){S.role=x.dataset.setrole;return}
 if(x=g('[data-clearf]')){e.preventDefault();Object.keys(S.flt).forEach(k=>S.flt[k]=[]);S.q='';render();return}
 if(x=g('[data-req]')){
  if(S.role==='guest'){S.ret=location.hash;modal();return}
  if(S.role==='seller'){toast(t('s_role_note'));return}
  const id=x.dataset.id,ty=x.dataset.req;
  if(ty==='dr'&&!cdaOk(id)){toast(t('need_cda'));return}
  if(!rstat(id,ty))S.reqs.push({id,type:ty,status:'pending',d:'2026-09-29'});toast(t('sent'));render();return}
 if(x=g('[data-next]')){const f=x.dataset.next;if(!validate(f)){render();const b=document.querySelector('.fld.bad');b&&b.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(S.step[f]===3)S.done[f]=true;else S.step[f]++;render();scrollTo(0,0);return}
 if(x=g('[data-prev]')){const f=x.dataset.prev;if(S.step[f]>0)S.step[f]--;render();return}
 if(x=g('[data-reset]')){const f=x.dataset.reset;S.f[f]={};S.step[f]=0;S.done[f]=false;S.err={};render();return}
 if(x=g('[data-upl]')){const [f,n]=x.dataset.upl.split('.');S.f[f][n]=1;render();return}
 if(x=g('[data-fb]')){S.fbOpen[x.dataset.fb]=!S.fbOpen[x.dataset.fb];render();return}
 if(x=g('[data-revoke]')){S.revoked[x.dataset.revoke]=1;render();return}
 if(x=g('[data-editm]')){S.editM=+x.dataset.editm;render();return}
 if(x=g('[data-savem]')){const m=S.mands[+x.dataset.savem];m.target=$('#e-target').value||m.target;m.budget=$('#e-budget').value;m.rights=$('#e-rights').value;S.editM=-1;render();return}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.role!==undefined){S.role=el.value;render();return}
 if(el.dataset.sort!==undefined){S.sort=el.value;$('#list').innerHTML=listHtml();return}
 if(el.dataset.flt){const f=S.flt[el.dataset.flt];const i=f.indexOf(el.value);i<0?f.push(el.value):f.splice(i,1);$('#list').innerHTML=listHtml();return}
 if(el.dataset.m){const [f,n]=el.dataset.m.split('.');const a=S.f[f][n]=S.f[f][n]||[];const i=a.indexOf(el.value);i<0?a.push(el.value):a.splice(i,1);return}
 if(el.dataset.f){const [f,n]=el.dataset.f.split('.');S.f[f][n]=el.type==='checkbox'?el.checked:el.value}
});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='q'){S.q=el.value;$('#list').innerHTML=listHtml();return}
 if(el.dataset.f&&el.type!=='checkbox'){const [f,n]=el.dataset.f.split('.');S.f[f][n]=el.value}
});
render();
</script>
</body>
</html>
