<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aegis APX — Pipeline Exchange</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234a7566' fill-rule='evenodd' clip-rule='evenodd'%3E%3Cpath d='M12 2.4 20 5.4V11.2C20 16 16.4 19.4 12 20.9 7.6 19.4 4 16 4 11.2V5.4L12 2.4ZM12 8.1 15.3 14H13.4L12 11.2 10.6 14H8.7L12 8.1Z'/%3E%3C/svg%3E">
<style>
:root{--bg:#f2f4f7;--surface:#fff;--surface2:#f5f7fa;--line:#e1e5ea;--text:#12161c;--mute:#707a8a;--accent:#1e5fe0;--accent-ink:#fff;--accent-soft:#e6eefc;--up:#0a8f5c;--up-bg:#e3f5ec;--warn:#9a6a00;--warn-bg:#fbf1d8;--ok:#0a8f5c;--ok-bg:#e3f5ec;--err:#d0342c;--lock:#f5f7fa;--r:4px}
[data-theme=dark]{--bg:#0b0e11;--surface:#161a1e;--surface2:#1e2329;--line:#2b3139;--text:#eaecef;--mute:#848e9c;--accent:#4c8dff;--accent-ink:#0b0e11;--accent-soft:#16233d;--up:#2ebd85;--up-bg:#12332a;--warn:#f0b90b;--warn-bg:#33290a;--ok:#2ebd85;--ok-bg:#12332a;--err:#f6465d;--lock:#12161a}
*{box-sizing:border-box}
html{scroll-behavior:auto}
body{margin:0;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",Roboto,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent);text-decoration:none}
.mono,.num,b.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;line-height:1.25;font-weight:600}
h1{font-size:34px;letter-spacing:-.02em}h2{font-size:20px}h3{font-size:14px}h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
p{margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:18px;height:48px}
.logo{font-weight:700;color:var(--text);font-size:15px;display:flex;align-items:center;gap:8px;text-decoration:none;letter-spacing:-.01em}
.logo:hover{color:var(--text)}
.logo .aegis-mark{color:var(--accent);transition:transform .18s ease;display:inline-block;vertical-align:middle;flex-shrink:0}
.logo:hover .aegis-mark{transform:scale(1.08)}
.logo-text{display:inline-flex;align-items:baseline;gap:5px}
.logo-brand{font-weight:700;letter-spacing:-.02em;color:var(--text);font-size:16px}
.logo-tag{font-weight:800;letter-spacing:.08em;color:var(--accent);font-size:13px;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
.logo-sub{font-size:11px;font-weight:500;color:var(--mute);letter-spacing:0;margin-left:2px}
nav.links{display:flex;gap:0;flex:1;overflow-x:auto;scrollbar-width:none;height:100%}
nav.links a{color:var(--mute);padding:0 14px;display:flex;align-items:center;white-space:nowrap;font-weight:500;border-bottom:2px solid transparent}
nav.links a.on,nav.links a:hover{color:var(--text)}
nav.links a.on{border-color:var(--accent)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;background:var(--surface2);border-radius:var(--r);padding:2px}
.seg button{border:0;background:transparent;color:var(--mute);padding:3px 9px;cursor:pointer;font:inherit;font-size:12px;border-radius:3px}
.seg button.on{background:var(--line);color:var(--text)}
select,input[type=text],input[type=email],input[type=url],textarea{font:inherit;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%}
select:focus,input:focus,textarea:focus,button:focus-visible{outline:1px solid var(--accent);border-color:var(--accent)}
.tools select{width:auto;padding:4px 8px;font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 18px;border-radius:var(--r);font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--mute)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:default}
.btn.danger{background:transparent;border-color:var(--err);color:var(--err)}
#ticker{border-top:1px solid var(--line);background:var(--bg);overflow:hidden;height:28px;display:flex;align-items:center;font-size:12px}
#ticker .tk{display:flex;gap:32px;white-space:nowrap;animation:tk 60s linear infinite;padding-left:32px}
#ticker:hover .tk{animation-play-state:paused}
#ticker span{color:var(--mute)}#ticker b{font-family:ui-monospace,Menlo,monospace;font-weight:500;color:var(--text);margin-left:6px}#ticker b.up{color:var(--up)}
@keyframes tk{to{transform:translateX(-50%)}}
@media(prefers-reduced-motion:reduce){#ticker .tk{animation:none}}
main{min-height:70vh;padding:20px 0 60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.tag{display:inline-block;font-size:12px;padding:1px 7px;border-radius:3px;background:var(--surface2);color:var(--mute);white-space:nowrap}
.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.mute{color:var(--mute)}.sm{font-size:12px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
section.blk{margin-top:40px}
section.blk>h2{margin-bottom:4px}section.blk>.sub{color:var(--mute);margin-bottom:14px;max-width:720px}
.hero{padding:20px 0 0}
.hgrid{display:grid;grid-template-columns:1.25fr 1fr;gap:24px;align-items:stretch}
.hero p.lead{font-size:15px;color:var(--mute);max-width:640px;margin:14px 0 22px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn{padding:11px 24px;font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel .ph{display:flex;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.panel .pr{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border-bottom:1px solid var(--line)}
.panel .pr:last-of-type{border:0}
.panel .pr span{color:var(--mute);font-size:12px;max-width:190px}
.panel .pr b{font-size:24px;font-weight:600;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.panel .pr b.up{color:var(--up)}
.panel .pf{padding:8px 14px;color:var(--mute);font-size:11px;border-top:1px solid var(--line)}
.flow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 10px;background:var(--surface2);border-radius:var(--r)}
.steps li span.n{flex:none;width:20px;height:20px;border-radius:3px;background:var(--line);color:var(--text);font-size:11px;display:grid;place-items:center;font-weight:600;font-family:ui-monospace,Menlo,monospace}
.merge{text-align:center;margin:10px 0;padding:8px;border:1px solid var(--accent);border-radius:var(--r);color:var(--accent);font-weight:600;background:var(--accent-soft);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.chain{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.chain div{padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);position:relative}
.chain div:not(:last-child):after{content:"›";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--mute);z-index:2;font-size:16px}
footer{border-top:1px solid var(--line);background:var(--surface);padding:22px 0;color:var(--mute);font-size:12px}
footer .cols{display:flex;gap:30px;flex-wrap:wrap;justify-content:space-between}
.cat{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
.filters{position:sticky;top:90px;padding:4px 14px 14px}
.filters h4{margin:14px 0 6px}
.filters label,.chk{display:flex;gap:8px;align-items:center;padding:2px 0;cursor:pointer}
.chk input,.filters input{width:auto;accent-color:var(--accent)}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toolbar input{flex:1}.toolbar select{width:auto}
.bar-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden;flex:1}
.bar-fill{height:100%;background:var(--up)}
.co{color:var(--mute);font-size:12px}
.pill{display:inline-block;padding:1px 8px;border:1px solid var(--line);border-radius:3px;font-size:12px;font-family:ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
.kv{display:grid;grid-template-columns:130px 1fr;gap:0;margin:0}
.kv dt,.kv dd{padding:8px 0;border-bottom:1px solid var(--line);margin:0}
.kv dt{color:var(--mute)}
.layer{margin-top:12px}
.layer .lh{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.lock{background:var(--lock);border-style:dashed;text-align:center;padding:22px}
.lock .ico{font-size:20px;opacity:.7}
.lock ul{list-style:none;padding:0;margin:10px auto;display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center}
.brk{display:grid;gap:10px}
.brk .row{display:grid;grid-template-columns:90px 1fr 30px;gap:10px;align-items:center}
.crumb{color:var(--mute);margin-bottom:10px;font-size:12px}
.formw{max-width:720px;margin:0 auto}
.prog{display:flex;gap:6px;margin:16px 0}
.prog div{flex:1;font-size:12px;color:var(--mute);border-top:2px solid var(--line);padding-top:6px}
.prog div.on{border-color:var(--accent);color:var(--text)}
.prog div.done{border-color:var(--up);color:var(--up)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{display:flex;flex-direction:column;gap:4px}.fld.full{grid-column:1/-1}
.fld>label,.fld>.lbl{font-weight:500;font-size:13px;color:var(--text)}
.fld .req{color:var(--err)}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--err)}
.emsg{color:var(--err);font-size:12px}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px}
.upload{border:1px dashed var(--line);border-radius:var(--r);padding:16px;text-align:center;color:var(--mute);cursor:pointer;background:var(--surface2)}
.upload.has{color:var(--ok);border-color:var(--ok)}
.actions{display:flex;justify-content:space-between;margin-top:20px}
.success{text-align:center;padding:40px 20px}
.success .ok-i{width:44px;height:44px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;font-size:22px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.dsec{margin-top:24px}.dsec>h3{margin-bottom:8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.list{display:grid;gap:8px}
.row2{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin:12px 0}
.pipe div{font-size:11px;color:var(--mute);border-top:3px solid var(--line);padding-top:4px}
.pipe div.on{border-color:var(--up);color:var(--text)}
.pipe div.cur{font-weight:700;color:var(--up)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
tr:last-child td{border:0}
th{color:var(--mute);font-weight:500;font-size:12px;text-transform:none;letter-spacing:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:20px}
.modal .card{max-width:420px;width:100%}
.modal .actions{justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r);z-index:60}
.info{padding:10px 14px;border-radius:var(--r);background:var(--accent-soft);border:0;font-size:13px}
.score{text-align:right}
.score b{display:block;font-size:26px;font-family:ui-monospace,Menlo,monospace;color:var(--up)}
.score span{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}

/* Partner & Collaborator Logos Marquee */
.marquee-wrap{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.marquee-head{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface2)}
.marquee-head .eyebrow{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
.marquee-head .count{font-size:11px;color:var(--mute);font-family:ui-monospace,Menlo,monospace}
.logo-marquee-mask{position:relative;overflow:hidden;padding:16px 0;width:100%;
 -webkit-mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent);
 mask-image:linear-gradient(to right,transparent,#000 48px,#000 calc(100% - 48px),transparent)}
.logo-marquee-track{display:flex;align-items:center;gap:44px;width:max-content;animation:marquee-scroll 60s linear infinite;will-change:transform}
.logo-marquee-mask:hover .logo-marquee-track{animation-play-state:paused}
@keyframes marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.logo-item{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .18s ease}
.logo-item:hover{transform:scale(1.08)}
.logo-item img{display:block;width:auto;max-width:none;object-fit:contain;opacity:.72;filter:grayscale(100%);transition:opacity .2s,filter .2s}
.logo-item:hover img{opacity:1;filter:grayscale(0%)}
[data-theme=dark] .logo-item img{filter:brightness(0) invert(.82);opacity:.78}
[data-theme=dark] .logo-item:hover img{filter:brightness(0) invert(1);opacity:1}
@media(prefers-reduced-motion:reduce){.logo-marquee-track{animation:none}.logo-marquee-mask{overflow-x:auto}}
@media(max-width:860px){
 h1{font-size:26px}
 .hgrid,.flow,.g2,.two,.cat,.fg{grid-template-columns:1fr}
 .g3,.g4,.chain{grid-template-columns:1fr 1fr}
 .filters{position:static}.chain div:after{display:none}
     .kv{grid-template-columns:100px 1fr}
}
@media(max-width:768px){.logo-sub{display:none}}
@media(max-width:520px){.g3,.g4,.chain{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.pipe div{font-size:10px}.logo-sub{display:none}.tools{margin-left:auto}}

.ic{flex:none;vertical-align:middle}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:root{--tc-amylin:#2a78d6;--tc-multi:#1baf7a;--tc-glp1:#eb6834;--tc-mstn:#4a3aa7}
[data-theme=dark] .land .bt{fill:#12110d}
[data-theme=dark]{--tc-amylin:#3987e5;--tc-multi:#199e70;--tc-glp1:#d95926;--tc-mstn:#9085e9}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.spark .sl{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round}
.spark .sa{fill:var(--accent);opacity:.12}.spark .sd{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.ring .rt{fill:none;stroke:var(--line)}.ring .rf{fill:none;stroke:var(--up)}.ring .rv{fill:var(--text);font-family:ui-monospace,Menlo,monospace;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.chip{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1px solid var(--line);border-radius:99px;color:var(--mute);font-size:12px;background:var(--surface)}
.chip .ic{color:var(--accent)}
.lane{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px}
.lname{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.node{position:relative;padding-right:14px;min-width:0}
.node:not(:last-child):after{content:"";position:absolute;top:19px;left:46px;right:6px;height:1px;background:var(--line)}
.nic{width:38px;height:38px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;position:relative;z-index:1}
.node .nn{font-size:10px;color:var(--mute);margin-top:8px}
.node .nt{font-size:12px;line-height:1.35;margin-top:2px}
.conv{display:flex;align-items:center;justify-content:center;gap:10px;margin:2px 0 8px}
.conv:before,.conv:after{content:"";flex:1;height:1px;background:var(--accent);opacity:.5}
.conv b{display:inline-flex;gap:8px;align-items:center;padding:8px 16px;border:1px solid var(--accent);border-radius:99px;color:var(--accent);background:var(--accent-soft);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.lane.chainl{grid-template-columns:1fr}
.feat{display:flex;flex-direction:column;gap:10px}
.feat .fi{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:12px}
.layp{position:relative;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:8px;overflow:hidden}
.layp .lv{height:3px;background:var(--line);border-radius:2px;margin-top:auto}.layp .lv i{display:block;height:100%;background:var(--accent);border-radius:2px}
.layp.o1 .lv i{width:33%}.layp.o2 .lv i{width:66%}.layp.o3 .lv i{width:100%}
.layp .lb{display:flex;justify-content:space-between;align-items:center;color:var(--accent)}
.layp .lb span{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--mute)}
.snap{display:grid;grid-template-columns:150px 1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.snap>div{background:var(--surface);padding:12px 14px;min-width:0}
.snap .big{font-size:36px;font-weight:600;font-family:ui-monospace,Menlo,monospace;line-height:1}
.stk{display:flex;gap:2px;height:10px;margin:10px 0 8px}.stk i{display:block;border-radius:2px;min-width:4px}
.leg{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:12px;color:var(--mute)}.leg b{color:var(--text);font-family:ui-monospace,Menlo,monospace;font-weight:500;margin-left:2px}
.hb{display:grid;grid-template-columns:76px 1fr 22px;gap:8px;align-items:center;font-size:12px;margin-top:6px}
.hb div.t{height:6px;background:var(--surface2);border-radius:2px}.hb div.t i{display:block;height:100%;background:var(--accent);border-radius:2px}
.dots{display:inline-flex;gap:3px;margin-right:6px;vertical-align:middle}.dots i{width:14px;height:4px;background:var(--line);border-radius:2px}.dots i.on{background:var(--accent)}
.tl{display:grid;grid-template-columns:repeat(5,1fr);margin:16px 0 6px}
.tl div{position:relative;font-size:11px;color:var(--mute);padding-top:16px;text-align:left}
.tl div:before{content:"";position:absolute;top:4px;left:0;right:0;height:2px;background:var(--line)}
.tl div:after{content:"";position:absolute;top:0;left:0;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.tl div.on:before{background:var(--accent)}.tl div.on:after{background:var(--accent);border-color:var(--accent)}
.tl div.cur{color:var(--text);font-weight:600}.tl div.cur:after{box-shadow:0 0 0 4px var(--accent-soft)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0}
.facts div{background:var(--surface);padding:10px 12px}.facts span{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}.facts b{font-weight:600}
.ins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ins .card{display:flex;gap:12px;padding:14px}.ins .card .fi{flex:none;width:34px;height:34px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.ins h4{margin-bottom:4px}

/* Invite gate styles */

.invite-btn:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 3px 8px rgba(21,20,15,.14)}

/* Pure Frosted Glass Masking for Gated Lists */
.gated-frosted-zone{position:relative;overflow:hidden;border-radius:0 0 var(--r) var(--r);cursor:pointer;transition:transform .15s ease}
.gated-frosted-content{filter:blur(8px);opacity:.32;pointer-events:none;user-select:none;transform:scale(0.995);transform-origin:top center}
.gated-frosted-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,rgba(255,255,255,.3) 0%,rgba(255,255,255,.88) 75%);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-align:center;transition:background .2s ease}
[data-theme=dark] .gated-frosted-overlay{background:linear-gradient(180deg,rgba(22,26,30,.3) 0%,rgba(22,26,30,.92) 75%)}
.gated-frosted-zone:hover .gated-frosted-overlay{background:linear-gradient(180deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.82) 75%)}
[data-theme=dark] .gated-frosted-zone:hover .gated-frosted-overlay{background:linear-gradient(180deg,rgba(22,26,30,.2) 0%,rgba(22,26,30,.88) 75%)}
.gated-pill-cta{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:99px;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 32px rgba(15,23,42,.12),0 0 0 1px rgba(0,0,0,.03);color:var(--text);font-size:13px;font-weight:600;transition:all .22s cubic-bezier(0.16,1,0.3,1)}
[data-theme=dark] .gated-pill-cta{background:rgba(30,36,46,.88);border:1px solid rgba(255,255,255,.12);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.gated-frosted-zone:hover .gated-pill-cta{transform:scale(1.04) translateY(-2px);border-color:var(--accent);box-shadow:0 16px 36px rgba(21,20,15,.14)}
.gated-pill-ico{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.gated-pill-cta b{color:var(--accent);margin-left:4px}

/* Frosted Modal Styles */
.modal{position:fixed;inset:0;background:rgba(12,18,28,.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:grid;place-items:center;z-index:100;padding:20px;animation:fadeIn .2s ease}
.modal .card{background:rgba(255,255,255,.92);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.8);box-shadow:0 24px 60px -10px rgba(15,23,42,.25),0 0 0 1px rgba(255,255,255,.5) inset;border-radius:16px;max-width:430px;width:100%;position:relative;animation:popIn .24s cubic-bezier(0.16,1,0.3,1)}
[data-theme=dark] .modal .card{background:rgba(22,28,36,.88);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 60px -10px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.05) inset}
@keyframes popIn{from{opacity:0;transform:scale(0.92) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-close-x{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--mute);font-size:16px;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;transition:all .15s ease}
.modal-close-x:hover{color:var(--text);background:var(--surface2)}
.modal input[type="text"]{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:8px;transition:all .15s ease}

.modal input[type="text"]:focus{background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent);outline:none}
[data-theme=dark] .modal input[type="text"]:focus{background:rgba(18,24,32,1);border-color:var(--accent)}
.gated-ico{width:48px;height:48px;margin:0 auto 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}

.gated-radar-wrap{position:relative;overflow:hidden;border-radius:var(--r);margin-top:10px;cursor:pointer}
.gated-radar-wrap .gated-content{filter:blur(6px);opacity:.28;pointer-events:none;user-select:none}
.gated-radar-wrap .gated-shield{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background:rgba(255,255,255,.72);backdrop-filter:blur(6px);text-align:center}

.gated-shield .gated-ico-sm{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:8px}
.gated-shield b{font-size:13px;color:var(--text);margin-bottom:4px}
.gated-shield p{font-size:11px;color:var(--mute);margin-bottom:12px;max-width:210px}
.shake{animation:shake .35s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.life{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative;padding-top:34px}

.life .mk{white-space:nowrap;position:absolute;top:36px;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--up);font-family:ui-monospace,Menlo,monospace}

.svcs .card{display:flex;flex-direction:column;gap:10px}
.svcs .tagl{margin-top:auto;padding-top:10px;border-top:1px solid var(--line);color:var(--mute);font-size:12px}
.lad{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:12px}
.lad div{position:relative;padding:12px 14px;border:1px solid var(--line);background:var(--surface)}
.lad div:not(:last-child):after{content:"\203A";position:absolute;right:-8px;top:50%;transform:translateY(-50%);z-index:2;background:var(--bg);color:var(--accent);font-size:16px;width:14px;text-align:center}
.lad div:nth-child(1){opacity:.85}.lad div:nth-child(4){border-color:var(--up)}
.lad b{display:block}.lad span{font-size:12px;color:var(--mute)}
.jpm{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:22px;padding:14px 16px;border:1px solid var(--accent);border-radius:var(--r);background:var(--accent-soft)}
.jpm b{display:block}.jpm span{color:var(--mute)}
.pocr{display:grid;grid-template-columns:140px 1fr;gap:16px;align-items:center}
.pocr .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line)}

/* ===== Aegis skin: paper, ink, sage ===== */
#ticker[hidden]{display:none}
:root{--bg:#faf9f6;--surface:#fff;--surface2:#f3f1ea;--line:#e8e5dc;--text:#15140f;--mute:#6a675d;--accent:#4a7566;--accent-ink:#fff;--accent-soft:#e8efeb;--up:#4a7566;--up-bg:#e8efeb;--warn:#a2641f;--warn-bg:#f6ead8;--ok:#4a7566;--ok-bg:#e8efeb;--err:#c0392b;--lock:#f3f1ea;--r:16px;--ink:#15140f;--cu:#b86f48;--rib1:#3f6556;--rib2:#2c4a3e;--rib3:#9cc0b0;--tc-amylin:#4a7566;--tc-multi:#b86f48;--tc-glp1:#7366c4;--tc-mstn:#3f6fa0}
[data-theme=dark]{--bg:#12110d;--surface:#1b1a15;--surface2:#24231d;--line:#33322a;--text:#f2f0e8;--mute:#aeab9f;--accent:#8fb5a3;--accent-ink:#12110d;--accent-soft:#1f2c26;--up:#8fb5a3;--up-bg:#1f2c26;--warn:#e0a85a;--warn-bg:#352a17;--ok:#8fb5a3;--ok-bg:#1f2c26;--err:#ee7d6d;--lock:#1b1a15;--ink:#f2f0e8;--cu:#d28a60;--rib1:#6f9a88;--rib2:#4d7566;--rib3:#a8cbbb;--tc-amylin:#8fb5a3;--tc-multi:#d28a60;--tc-glp1:#a79ce6;--tc-mstn:#7fb0e0}
body{font-family:"Open Runde",Geist,Inter,"SF Pro Display",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",sans-serif;font-size:14px;letter-spacing:-.005em}
h1,h2,h3{letter-spacing:-.03em;font-weight:600}
.mono,.num,b.mono{font-variant-numeric:tabular-nums}
.sn{display:none}
.wrap{max-width:1200px;padding:0 24px}
main{padding:12px 0 80px}
.demo{background:var(--surface2);color:var(--text);border:0;font-size:12.5px;text-align:center}
.demo .wrap{position:relative;justify-content:center;padding:6px 44px}.demo span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

header.top{position:sticky;top:12px;z-index:40;background:transparent;border:0;padding:12px 16px 0;pointer-events:none}

.bar select{background:rgba(255,255,255,.1);color:#faf9f6;border-color:rgba(255,255,255,.16);border-radius:99px}

.bar .seg{background:rgba(255,255,255,.1);border-radius:99px}.bar .seg button{color:rgba(250,249,246,.65);border-radius:99px}.bar .seg button.on{background:#faf9f6;color:#15140f}

.btn{background:var(--ink);border-color:var(--ink);color:var(--bg);border-radius:99px;padding:11px 22px;font-weight:600;box-shadow:none}

.card{padding:22px}

/* hero */

.hero2 .eyebrow{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}

 g+=coil(560,95,790,330,36,5,24)+coil(520,395,760,190,30,4,22)+coil(610,70,700,175,24,3,18)+coil(690,410,860,260,26,3,20);

function wbMigrate(old){

 try{
  S.db=wbEmptyDb();wbSeed();
  const own=Array.isArray(old&&old.own)?old.own:[],SV={v:'verify',a:'advisory',b:'broker',c:'coinvest'},wait=(old&&old.wait)||{},wv=(old&&old.waitv)||{};
  let mx=0;
  own.slice().reverse().forEach(x=>{
   if(!x||typeof x.id!=='string'||!Array.isArray(x.name))return;
   const ok=/^S-\d+$/.test(x.id)&&!wbRaw('asset',x.id);
   const led={profile:'provided'};
   if(wait[x.id+'|data']==='done')led.data={state:'provided',note:String(wv[x.id+'|data']||'').slice(0,200)};
   if(wait[x.id+'|auth']==='done')led.authority='provided';
   if(wait[x.id+'|bd']==='done')led.team={state:'provided',note:String(wv[x.id+'|bd']||'').slice(0,200)};
   const sv=Array.isArray(x.sm)&&Array.isArray(x.sm[1])?x.sm[1].map(k=>SV[k]).filter(Boolean):[];
   const o={actor:'you',seed:true,on:wbToday(),meta:{migrated:true},payload:{name:[String(x.name[0]||''),String(x.name[1]||x.name[0]||'')],profile:{mech:x.name,target:'',stage:'',ind:'',form:'',ip:'',data:[]},svc:sv,ledger:led,demo:false}};
   if(ok)o.id=x.id;
   const r=wbTx('asset',null,'submit',o);if(r.ok)mx=Math.max(mx,wbNum(r.rec.id))});
  S.db.seq.S=Math.max(S.db.seq.S,mx);

 }finally{S.db=keep}
 return{db:res,assets:Object.values(res.assets).filter(a=>!a.demo).length}}

/* ---------- events ---------- */
try{history.scrollRestoration='manual'}catch(_){}
const scrollPos={};let curY=0,lastClick=0;

addEventListener('hashchange',e=>{
 S.menu=false;S.setm=false;

});
document.addEventListener('click',e=>{
 if((S.setm||S.menu)&&!e.target.closest('#bar')){S.setm=false;S.menu=false;chrome()}
 else if(e.target.closest('#setpop,#navsheet')&&e.target.closest('a,button')&&!e.target.closest('[data-lang],[data-theme-t],[data-demo-t]'))setTimeout(()=>{S.setm=false;S.menu=false;chrome()},0);

 if(e.target.closest('[data-navtoggle]')){S.menu=!S.menu;S.setm=false;chrome();return}
 const g=s=>e.target.closest(s);let x;lastClick=Date.now();
 if(x=g('[data-open-invite]')){e.preventDefault();inviteModal();return}
 if(x=g('[data-relock]')){doRelock();return}
 if(x=g('.quick-invite-btn')){

   if(inp){inp.classList.add('shake');setTimeout(()=>inp.classList.remove('shake'),400)}
  }
  return;
 }
 if(wbClick(e,g))return;
 if(x=g('[data-watch]')){e.stopPropagation();if(!S.inviteUnlocked){S.ret=location.hash;S.pend={type:'watch',cat:x.dataset.watch};inviteModal();return}wbToggleWatch(x.dataset.watch);return}
 if(x=g('[data-rmf]')){const [k,v]=x.dataset.rmf.split('|');if(k==='q')S.q='';else S.flt[k]=S.flt[k].filter(y=>y!==v);render();return}

 if(x=g('[data-demox]')){S.bannerOff=true;render();return}

 if(x=g('[data-theme-t]')){S.theme=x.dataset.themeT;render();return}
 if(x=g('[data-close]')){if(e.target===x||x.tagName==='BUTTON'||x.tagName==='A')closeOverlay();return}
 if(x=g('[data-editbp]')){S.buyerEdit=true;S.buyerAdded=false;render();return}
 if(x=g('[data-compose]')){const off=S.composer==='mandate';S.composer=off?null:'mandate';if(off)S.cmp={mandate:{}};if(!/^#(workbench|buyer-dash)/.test(location.hash)){location.hash='#workbench?v=discover';return}render();const c=document.querySelector('#c-target');c&&c.focus();return}
 if(x=g('[data-savecm]')){const c=S.cmp.mandate,tg=($('#c-target').value||'').trim();if(!tg){toast(t('required'));return}
  const r=wbTx('mandate',null,'create',{actor:'you',payload:{demo:false,target:tg,areas:c.areas&&c.areas.length?c.areas:['obesity'],stages:c.stages&&c.stages.length?c.stages:['pre','p1'],forms:c.forms&&c.forms.length?c.forms:['inj'],rights:$('#c-rights').value,budget:$('#c-budget').value,excl:[["None","无"]]}});
  if(!r.ok){toast(t(r.err));return}S.cmp.mandate={};S.composer=null;toast(t('saved'));render();return}
 if(x=g('[data-clearf]')){e.preventDefault();Object.keys(S.flt).forEach(k=>S.flt[k]=[]);S.q='';render();return}
 if(x=g('[data-req]')){

 if(x=g('[data-next]')){const f=x.dataset.next;if(!validate(f)){render();const b=document.querySelector('.fld.bad'),c=b&&b.querySelector('input,select,textarea');if(c)c.focus();else if(b)b.scrollIntoView({block:'center',behavior:'instant'});return}
  if(S.step[f]===(f==='seller'?2:3)){S.done[f]=true;if(f==='seller'){const id=wbSubmitAsset(S.f.seller);S.wbUi.focus='';if(id){location.hash=wbHref('asset',id);toast(t('wb_msg_submitted'))}}else if(!S.buyerAdded){S.buyerAdded=true;const d=S.f.buyer;wbTx('mandate',null,'create',{actor:'you',payload:{demo:false,target:d.mtarget||'—',areas:d.areas||[],stages:d.stages||[],forms:d.forms||[],rights:d.mrights||'global',budget:d.budget||'b3',excl:d.excl&&d.excl.trim()?d.excl.trim():[['None','无']]}})}}else S.step[f]++;render();scrollTo({top:0,behavior:'instant'});return}
 if(x=g('[data-prev]')){const f=x.dataset.prev;if(S.step[f]>0)S.step[f]--;render();return}
 if(x=g('[data-reset]')){const f=x.dataset.reset;if(f==='seller')resetSeller();else{S.f[f]={};S.step[f]=0;S.done[f]=false;S.err={};if(f==='buyer')S.buyerAdded=false}render();scrollTo({top:0,behavior:'instant'});return}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&S.wbUi.bell){S.wbUi.bell=false;S.wbUi.focus='.wb-bell';render();return}

 if(e.key==='Tab'){const dlg=document.querySelector('#overlay [role=dialog]');if(dlg){const f=[...dlg.querySelectorAll('button,input,a[href],select,textarea,[tabindex]:not([tabindex="-1"])')].filter(n=>!n.disabled&&n.offsetParent!==null);if(f.length){const a=document.activeElement,i=f.indexOf(a);if(e.shiftKey&&(i<=0)){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}}}

   if(old.f&&typeof old.f==='object')S.f.seller=old.f;if(old.lang==='en'||old.lang==='zh')S.lang=old.lang;if(old.theme==='light'||old.theme==='dark')S.theme=old.theme}
  else{try{if(typeof navigator!=='undefined'&&/^zh/i.test(navigator.language||''))S.lang='zh'}catch(e){}}
 }catch(e){}
}

loadState();
render();
